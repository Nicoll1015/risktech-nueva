<!DOCTYPE html>
<!-- Fuente de assets/img/og/risktech.png (imagen al compartir en redes, 1200x630).
     Para regenerarla: ver README, sección "Imagen para redes sociales". -->
<html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:'Poppins',sans-serif;color:#fff;position:relative;
  background:radial-gradient(760px 420px at 88% 8%,rgba(108,99,255,.5),transparent 62%),radial-gradient(620px 380px at 0% 100%,rgba(255,101,84,.32),transparent 62%),linear-gradient(160deg,#000E1C,#001629 40%,#00223F)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.in{position:absolute;inset:0;padding:70px 80px;display:flex;flex-direction:column}
.logo{height:62px;width:auto;align-self:flex-start}
h1{font-size:66px;line-height:1.04;font-weight:800;letter-spacing:-.035em;margin-top:62px;max-width:900px}
h1 span{background:linear-gradient(90deg,#8F88FF,#FF8577 60%,#F5B841);-webkit-background-clip:text;background-clip:text;color:transparent}
.prods{margin-top:auto;display:flex;gap:12px;flex-wrap:wrap}
.prods span{font-size:20px;font-weight:600;padding:10px 20px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#DCE6F2}
.prods i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;vertical-align:1px}
</style></head>
<body><div class="grid"></div><div class="in">
<img class="logo" src="../assets/img/logos/risktech.png" alt="">
<h1>Prevención de <span>fraude y AML</span> con IA, en una sola plataforma.</h1>
<div class="prods"><span><i style="background:#00C2B8"></i>AMLRISK</span><span><i style="background:#6C63FF"></i>FRAML MS AntiFraud</span><span><i style="background:#2F80ED"></i>FRAML MS AML</span><span><i style="background:#FF6554"></i>FRAML Alert Defense</span></div>
</div></body></html>
